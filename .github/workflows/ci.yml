name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      # -race because internal/xdrcopy shares encoder/decoder buffers across
      # calls through sync.Pool: TestCopyConcurrentReuse only proves the
      # no-aliasing guarantee holds under concurrency if something is actually
      # watching for concurrent misuse.
      - name: test
        run: go test -race ./...

  golden-drift:
    name: golden vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # @stellar/stellar-sdk@17.1.0 declares engines node >=22.12.0.
          node-version: '22'
          cache: npm
          cache-dependency-path: testdata/gen/package-lock.json

      # npm ci installs exactly the committed lockfile and fails if
      # package.json and the lockfile disagree, so the reference build cannot
      # drift without this step noticing.
      - name: install the pinned reference sdk
        working-directory: testdata/gen
        run: npm ci

      - name: regenerate the vectors
        working-directory: testdata/gen
        run: node gen.mjs

      # The vectors are generated, committed artefacts. If regenerating them
      # changes anything, then either someone edited a vector by hand or the
      # reference implementation moved, and in both cases the committed
      # evidence no longer says what it claims to.
      - name: fail if the committed vectors changed
        run: |
          if ! git diff --exit-code testdata/vectors; then
            echo
            echo "The committed golden vectors differ from freshly generated ones."
            echo "Vectors are never edited by hand. Regenerate them with:"
            echo "  cd testdata/gen && npm ci && node gen.mjs"
            echo "and commit the result, or investigate why the reference output moved."
            exit 1
          fi

  python-parity:
    name: python sdk parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The runner's system python is used on purpose: the harness pins the one
      # dependency it needs in requirements.txt, and pulling in a toolchain
      # action would be one more thing to keep pinned for no benefit.
      - name: install the pinned reference sdk and run the parity harness
        run: |
          python3 -m venv .venv-parity
          . .venv-parity/bin/activate
          pip install -r testdata/parity-python/requirements.txt
          python3 testdata/parity-python/parity.py
          python3 testdata/parity-python/test_parity.py

  wasm:
    name: wasm signing core and typescript wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wasm/ts/package-lock.json
      # The core builds only for js/wasm, so `go build ./...` on the host skips
      # it. This job is the only place it is compiled, which is why the build is
      # a step of its own rather than folded into `go test`.
      - name: build the wasm module
        run: ./wasm/build.sh
      - name: wasm byte parity against the golden vectors
        run: node wasm/parity.mjs
      - name: typescript wrapper
        working-directory: wasm/ts
        run: |
          npm ci
          npm run typecheck
          npm test

  bench:
    name: signing-path budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      # ns/op is deliberately not gated: wall-clock on a shared runner is too
      # noisy to be evidence. allocs/op and B/op are deterministic and are
      # compared against testdata/bench/budgets.json.
      - name: run signing-path benchmarks
        run: go test -run '^$' -bench . -benchmem -count=1 . | tee bench.out
      - name: fail on allocation or byte regression
        run: go run ./scripts/checkbench bench.out testdata/bench/budgets.json

  parity-check:
    name: parity report check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: verify parity report against fixture
        run: |
          go test -tags e2e -run TestParityReportRegression ./e2e